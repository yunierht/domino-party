<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Domino Social Club game</title>
  <meta name="description" content="Open a live Domino Social Club match from a shared game code." />
  <link rel="icon" type="image/png" href="../img/icon.png?v=social-club" />
  <link rel="apple-touch-icon" href="../img/icon.png?v=social-club" />
  <style>
    :root {
      --ink: #0a0b0a;
      --panel: #111412;
      --line: #2d332e;
      --text: #f7f3e8;
      --muted: #b9b0a1;
      --gold: #d7ad55;
      --gold-2: #f1d17b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(10, 11, 10, 0.72), rgba(10, 11, 10, 0.96)),
        repeating-linear-gradient(45deg, #101210 0 10px, #0b0c0b 10px 20px);
      text-align: center;
    }
    main {
      width: min(420px, 100%);
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 20, 18, 0.96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }
    img { width: 86px; height: 86px; border-radius: 18px; margin: 0 auto 18px; }
    h1 { margin: 0; font-size: 1.55rem; line-height: 1.15; letter-spacing: 0; }
    p { color: var(--muted); margin: 10px 0 0; }
    .code {
      margin: 22px auto;
      padding: 12px 16px;
      border: 1px solid rgba(215, 173, 85, 0.28);
      border-radius: 8px;
      color: var(--gold-2);
      background: rgba(215, 173, 85, 0.08);
      font-size: 2.8rem;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
    }
    .button {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #e7c469;
      color: #171007;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      font-weight: 900;
      text-decoration: none;
    }
    .button.secondary {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
    }
    footer { margin-top: 20px; color: #7d766c; font-size: 0.86rem; }
  </style>
</head>
<body>
  <main>
    <img src="../img/icon.png?v=social-club" alt="Domino Social Club" />
    <h1>Follow this domino match live</h1>
    <p>Open Domino Social Club and enter the game code.</p>
    <div class="code" id="code">----</div>
    <a class="button" id="open" href="#">Open in the app</a>
    <a class="button secondary" data-store="android" href="https://play.google.com/store/apps/details?id=com.yht.dominoparty" target="_blank" rel="noopener">Get it on Google Play</a>
    <a class="button secondary" data-store="ios" href="https://apps.apple.com/app/id6793746031" target="_blank" rel="noopener">Download on the App Store</a>
    <footer>Domino Social Club by YHT</footer>
  </main>
  <script>
    var params = new URLSearchParams(location.search);
    var code = (params.get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    document.getElementById("code").textContent = code || "----";
    var appLink = "dominoparty://watch?code=" + encodeURIComponent(code);
    document.getElementById("open").href = appLink;
    var ua = navigator.userAgent || "";
    var isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    var platform = /android/i.test(ua) ? "android" : /iPad|iPhone|iPod/i.test(ua) || isIPadOS ? "ios" : "";
    var storeUrl = platform === "ios"
      ? "https://apps.apple.com/app/id6793746031"
      : platform === "android"
        ? "https://play.google.com/store/apps/details?id=com.yht.dominoparty"
        : "";
    if (platform) {
      document.querySelectorAll("[data-store]").forEach(function (link) {
        var preferred = link.getAttribute("data-store") === platform;
        link.classList.toggle("primary", preferred);
        link.classList.toggle("secondary", !preferred);
      });
    }
    if (code) {
      setTimeout(function () {
        window.location.href = appLink;
      }, 450);
      if (storeUrl) {
        // If the app is not installed, automatically continue to the matching
        // store. Opening the app suspends this page before the fallback fires.
        setTimeout(function () {
          window.location.replace(storeUrl);
        }, 1600);
      }
    } else if (storeUrl) {
      window.location.replace(storeUrl);
    }
  </script>
</body>
</html>
